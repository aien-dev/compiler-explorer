# Default settings for Omega
# omc runs only on AArch64 Linux and emits static AArch64 Linux executables. To run it elsewhere, set
# compiler-wrapper to qemu-aarch64-static and use an AArch64 objdump.

compilerType=omega
objdumper=objdump
supportsBinary=true
supportsExecute=true
instructionSet=aarch64
licenseName=Apache-2.0 WITH LLVM-exception
licenseLink=https://github.com/aien-dev/omega-mv/blob/main/LICENSE

compilers=&omega
defaultCompiler=omc

group.omega.compilers=omc
group.omega.groupName=Omega
group.omega.baseName=omc

compiler.omc.exe=/opt/omega/seed/out/omc
compiler.omc.name=omc
